name: scr-local

# =============================================================================
# SCR Platform — Local Development Stack
# =============================================================================
# Single entry point: http://local.scr.com/  (add "127.0.0.1 local.scr.com"
# to /etc/hosts first — see README.md)
#
#   /                  -> frontend  (React 18 + Vite dev server, HMR enabled)
#   /api/*             -> backend   (Laravel 13 / PHP 8.4 via php-fpm)
#
# Source code is bind-mounted from sibling repos (see .env BACKEND_PATH /
# FRONTEND_PATH) so edits on the host reflect instantly — no rebuild needed
# for PHP or JS/TS source changes.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # nginx — single reverse-proxy entry point for local.scr.com
  # ---------------------------------------------------------------------------
  nginx:
    build: ./nginx
    container_name: scr-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
      - ${BACKEND_PATH:-../../scr-backend}/storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - frontend
      - backend
      - websocket
    networks:
      - scr-local

  # ---------------------------------------------------------------------------
  # frontend — React 18 + Vite dev server (auto-bootstrapped if empty)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./node
    container_name: scr-frontend
    restart: unless-stopped
    environment:
      # NEXT_PUBLIC_* app URLs intentionally NOT set here — Next.js's env
      # loader always lets process.env win over .env.local, so anything
      # listed in this block would silently override scr-frontend's own
      # .env.sample/.env.local no matter what value you put there. Those
      # keys live solely in scr-frontend/.env.sample now; only genuinely
      # infra-level knobs belong in this block.
      APP_DOMAIN: "${APP_DOMAIN:-local.scr.com}"
      CHOKIDAR_USEPOLLING: "true" # reliable file-watching across bind mounts
    volumes:
      - ${FRONTEND_PATH:-../../scr-frontend}:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - scr-local
    # Not published to the host on purpose — everything routes through
    # nginx at http://local.scr.com/ (no separate port needed). Uncomment
    # below only if you want to hit the Vite server directly for debugging.
    # ports:
    #   - "${VITE_PORT:-5173}:5173"

  # ---------------------------------------------------------------------------
  # websocket — Node.js 24 + TypeScript + Socket.io server
  # ---------------------------------------------------------------------------
  websocket:
    build: ./websocket
    container_name: scr-websocket
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      WEBSOCKET_PORT: "3000"
      WEBSOCKET_HOST: "0.0.0.0"
      REDIS_URL: "redis://scr-redis:6379"
      LARAVEL_BASE_URL: "http://172.17.0.1/api/v1"
      REDIS_STREAMS_ENV: "local"
      REDIS_STREAMS_PREFIX: "scr-stream"
      REDIS_STREAMS_CONSUMER_STREAM: "node-to-core"
      REDIS_STREAMS_DB: "2"
    volumes:
      - ${WEBSOCKET_PATH:-../../scr-websocket}:/app
      - websocket_node_modules:/app/node_modules
    networks:
      - scr-local
    ports:
      - "${WEBSOCKET_PORT:-3000}:3000"

  # ---------------------------------------------------------------------------
  # backend — Laravel 13 / PHP 8.4-fpm (auto-bootstrapped if empty)
  # ---------------------------------------------------------------------------
  backend:
    build: ./php
    container_name: scr-backend
    restart: unless-stopped
    environment: &backend-env
      AUTO_BOOTSTRAP: "${AUTO_BOOTSTRAP:-true}"
      APP_DOMAIN: "${APP_DOMAIN:-local.scr.com}"
      POSTGRES_DB: "${POSTGRES_DB:-scr_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-scr}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-scr_local_password}"
      # AWS S3 / Floci configuration
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-test}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-test}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-scr-private-bucket}"
      AWS_BUCKET_PRIVATE: "${AWS_BUCKET_PRIVATE:-scr-private-bucket}"
      AWS_BUCKET_PUBLIC: "${AWS_BUCKET_PUBLIC:-scr-public-bucket}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-http://floci:4566}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-true}"
    volumes:
      - ${BACKEND_PATH:-../../scr-backend}:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./logs/php:/var/log/php
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-local-overrides.ini:ro
      - ./php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-local-overrides.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_healthy
    networks:
      - scr-local
    # php-fpm listens on 9000 internally; nginx reaches it via fastcgi_pass
    # backend:9000 — no host port needed.

  # ---------------------------------------------------------------------------
  # queue — dedicated worker so reminders/reports/ingestion jobs actually
  # process (SOW §3.4/3.5 reminders, §3.3 ingestion, §5 report generation)
  # Manages both Laravel Horizon and Redis stream consumer via Supervisor
  # ---------------------------------------------------------------------------
  queue:
    build: ./php
    container_name: scr-queue
    restart: unless-stopped
    command: ["supervisord", "-c", "/docker/supervisor/supervisord.conf"]
    environment: *backend-env
    volumes:
      - ${BACKEND_PATH:-../../scr-backend}:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./logs/php:/var/log/php
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-local-overrides.ini:ro
      - ./php/supervisor/supervisord.conf:/docker/supervisor/supervisord.conf:ro
    depends_on:
      - backend
    networks:
      - scr-local

  # ---------------------------------------------------------------------------
  # postgres — PostgreSQL 14 (matches SOW §2.3 exactly)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: scr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-scr_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-scr}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-scr_local_password}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scr} -d ${POSTGRES_DB:-scr_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scr-local

  # ---------------------------------------------------------------------------
  # redis — cache, session, and queue driver (SOW §3.4/3.5)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scr-local

  # ---------------------------------------------------------------------------
  # mailpit — catches all local outbound mail (invitations, reminders, §3.5)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: scr-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP — Laravel MAIL_HOST=mailpit MAIL_PORT=1025
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI — http://localhost:8025
    networks:
      - scr-local

  # ---------------------------------------------------------------------------
  # floci — AWS S3-compatible storage (all 75 AWS services on port 4566)
  # ---------------------------------------------------------------------------
  floci:
    image: floci/floci:latest
    container_name: scr-floci
    restart: unless-stopped
    # Grants the bind-mounted Docker socket group-write before Floci's own
    # entrypoint drops from root to its unprivileged `floci` user — see
    # floci/docker-entrypoint-wrapper.sh for why this is needed on this
    # Docker Desktop version. Without it, the Floci UI sidecar and any
    # Lambda/ECS/RDS emulation fail with "java.net.BindException:
    # Permission denied" trying to reach the Docker Engine API.
    entrypoint: ["/docker-entrypoint-wrapper.sh"]
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      # Docker socket required by Floci for service emulation
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
      - ./floci/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh:ro
    user: root
    environment:
      FLOCI_STORAGE_MODE: "${FLOCI_STORAGE_MODE:-hybrid}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-test}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-test}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-scr-private-bucket}"
      AWS_BUCKET_PRIVATE: "${AWS_BUCKET_PRIVATE:-scr-private-bucket}"
      AWS_BUCKET_PUBLIC: "${AWS_BUCKET_PUBLIC:-scr-public-bucket}"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/4566' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - scr-local

networks:
  scr-local:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  websocket_node_modules:
  floci_data:
