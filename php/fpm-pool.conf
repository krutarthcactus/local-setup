; =============================================================================
; ACR Platform — php-fpm pool log overrides
; =============================================================================
; php.ini controls PHP runtime behavior, but php-fpm's own access/error logs
; are configured at the pool level. This file is mounted into
; /usr/local/etc/php-fpm.d/ so both logs land in the host-visible
; ./logs/php directory for quick debugging without `docker exec`.

[www]
access.log = /var/log/php/fpm-access.log
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/log/php/fpm-error.log
php_admin_flag[log_errors] = on
