; =============================================================================
; ACR Platform — local PHP configuration overrides
; =============================================================================

; Manuscript PDFs up to 100MB per SOW §3.6
upload_max_filesize = 120M
post_max_size = 120M

memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Show errors locally for fast debugging (never enable in production)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Timezone — align with UTC used throughout SOW SLAs (§6.4)
date.timezone = UTC

; Opcache tuned for local dev: revalidate on every request so bind-mounted
; file edits are picked up instantly without needing to restart php-fpm.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256

; Sessions — Redis-backed in Laravel config, this just sets PHP-level session gc
session.gc_maxlifetime = 1440

realpath_cache_size = 4096K
realpath_cache_ttl = 600
