# =============================================================================
# SCR Platform — local.scr.com reverse proxy
# =============================================================================
# Single entry point on port 80:
#   /                 -> frontend (Vite dev server, with HMR websocket)
#   /api/*            -> backend (Laravel, via php-fpm)
#   /socket.io/*      -> websocket (Socket.io server)
#
# No ports needed in the browser URL — everything is reachable at
# http://local.scr.com/ once 127.0.0.1 local.scr.com is in /etc/hosts.
#
# `Connection: upgrade` must only be forwarded on genuine WebSocket upgrade
# requests. This map yields "upgrade" only when the client actually sent one,
# and "close" otherwise (the standard nginx-recommended pattern for proxying
# both plain HTTP and WebSocket traffic on one location).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name local.scr.com;

    # Manuscript uploads can be large PDFs (up to 100MB per SOW §3.6)
    client_max_body_size 120M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------
    # Laravel Horizon — dashboard for queue monitoring
    # Must be matched BEFORE /api since it's a more specific path.
    # -------------------------------------------------------------------
    location /horizon {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300;
    }

    # -------------------------------------------------------------------
    # Laravel API — served by php-fpm (backend container)
    # Front-controller pattern: every /api/* request is dispatched through
    # public/index.php, which resolves the route from routes/api.php.
    # -------------------------------------------------------------------
    location /api {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300;
    }

    # -------------------------------------------------------------------
    # Protected PDF — internal only. PHP returns an empty response with
    # `X-Accel-Redirect: /_protected_pdf/<bucket>/<key>?<presigned query>`
    # and nginx streams the object from Floci (local S3, path-style).
    # Production uses the same location name and header contract, with the
    # hardcoded AWS host and kube-dns resolver instead.
    # -------------------------------------------------------------------
    location ~ ^/_protected_pdf/(?<bucket>[^/]+)/(?<key>.+)$ {
        internal;                                   # unreachable from the browser
        resolver 127.0.0.11 valid=30s;              # Docker embedded DNS

        # Bucket allow-list: defense in depth. The SigV4 signature already binds bucket and key.
        if ($bucket != "scr-private-bucket") { return 403; }

        set $floci_host "floci:4566";
        proxy_pass http://$floci_host/$bucket/$key$is_args$args;
        proxy_set_header Host floci:4566;           # must match the host the URL was presigned for

        # S3 rejects a request with two auth mechanisms, so strip ours
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;

        proxy_buffering off;                        # stream straight through
        proxy_read_timeout 30s;

        add_header Content-Type "application/pdf" always;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # -------------------------------------------------------------------
    # Socket.io — real-time WebSocket server (scr-websocket container)
    # Socket.io's client always talks over the fixed /socket.io/ path no
    # matter what host/namespace you pass to `io(...)` on the client, so
    # this location must match that literal prefix. Must come before the
    # generic `location /` below.
    # -------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://websocket:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # -------------------------------------------------------------------
    # Next.js — dev server (frontend container), with HMR websocket
    # -------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
